        }

        body::-webkit-scrollbar-thumb {

            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        body::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(102, 126, 234, 0.6);

        /* Firefox Scrollbar */
        body {
            scrollbar-color: #667eea rgba(255, 255, 255, 0.08);
            scrollbar-width: auto;

        /* Animated Background Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            z-index: 1;
            animation: float 15s ease-in-out infinite;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ff1b6d, #ff6b9d);
            top: -50px;
            left: -50px;
            animation-delay: 0s;

        .blob-2 {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #ff9500, #ffb347);
            bottom: -30px;
            right: -30px;
            animation-delay: 2s;

        .blob-3 {
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(30px, -30px) scale(1.1);
            }

            50% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            75% {
                transform: translate(25px, 25px) scale(1.05);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;

            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            min-height: 100vh;

        /* Glass Card */

            background: rgba(255, 255, 255, 0.1);

            animation: slideUp 0.8s ease-out;
            position: relative;
            transition: all 0.3s ease;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%, rgba(102, 126, 234, 0.1) 100%);

            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .glass-card:hover {
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(102, 126, 234, 0.3),
                inset 0 0 30px rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
        }

        .glass-card:hover::before {
            opacity: 1;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            from {

            to {

    <script>
        // Enhanced Ripple Effect on Button Click
        function handleButtonClick(event) {
            const button = event.target;

            // Create multiple ripples for better effect
            for (let i = 0; i < 2; i++) {
                const ripple = document.createElement('span');

                // Get button dimensions
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = event.clientX - rect.left - size / 2;
                const y = event.clientY - rect.top - size / 2;

                // Set ripple styles
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = i === 0
                    ? 'radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent)'
                    : 'radial-gradient(circle, rgba(102, 126, 234, 0.6), transparent)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = `rippleEffect ${0.6 + i * 0.2}s ease-out`;
                ripple.style.pointerEvents = 'none';
                ripple.style.zIndex = i;

                // Add ripple to button
                button.style.position = 'relative';
                button.appendChild(ripple);

                // Remove ripple after animation
                setTimeout(() => ripple.remove(), (0.6 + i * 0.2) * 1000);
            }

            // Add a slight pulse effect to the button
            button.style.animation = 'buttonPulse 0.4s ease-out';
            setTimeout(() => {
                button.style.animation = '';
            }, 400);

            console.log('Button clicked:', button.textContent);
        }

        // Define animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rippleEffect {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
            
            @keyframes buttonPulse {
                0% {
                    transform: scale(1.05);
                }
                50% {
                    transform: scale(1.02);
                }
                100% {
                    transform: scale(1.05);
                }
            }
        `;
        document.head.appendChild(style);

        // Enhanced floating animation for the card
        const card = document.querySelector('.glass-card');
        let floatOffset = 0;

        setInterval(() => {
            floatOffset += 0.05;
            const floatY = Math.sin(floatOffset) * 4;
            const floatX = Math.cos(floatOffset * 0.7) * 2;
            card.style.transform = `translate(${floatX}px, ${floatY}px)`;
        }, 50);

        // Add staggered animation to buttons
        const buttons = document.querySelectorAll('.glass-button');
        buttons.forEach((btn, index) => {
            btn.style.animationDelay = `${index * 0.1}s`;
            btn.style.animation = 'buttonSlideIn 0.6s ease-out backwards';
        });

        // Add button slide in animation
        const slideInStyle = document.createElement('style');
        slideInStyle.textContent = `
            @keyframes buttonSlideIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(slideInStyle);
    </script>
</body>

</html>
