<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Nagar - Link in Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: #333;

            overflow-y: auto;
            /* ✅ scroll enable */
            overflow-x: hidden;
            /* ✅ horizontal scroll hide */
        }
/* nl */
        /* Animated Background Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.5;
            mix-blend-mode: screen;
            animation: float 8s infinite ease-in-out;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ff006e, #ff006e);
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #00d9ff, #00d9ff);
            bottom: -100px;
            right: -50px;
            animation-delay: 2s;
        }

        .blob-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ffd60a, #ffd60a);
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 30px);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            margin: 0 auto;
        }

        /* Glass Card - Main Content Container */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 50px 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            text-align: center;
            transition: all 0.3s ease;
            animation: cardFloat 0.8s ease-out;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(31, 38, 135, 0.5);
        }

        @keyframes cardFloat {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Profile Section */
        .name {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 35px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Links Container */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Glass Button Styling */
        .glass-button {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(31, 38, 135, 0.2);
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateX(8px);
            box-shadow: 0 8px 25px rgba(31, 38, 135, 0.35);
        }

        .glass-button:active {
            transform: translateX(4px) scale(0.98);
        }

        /* Button Icon */
        .button-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            margin-right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .button-icon img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            filter: brightness(1.2);
        }

        /* Button Text */
        .button-text {
            flex: 1;
            text-align: left;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .glass-card {
                padding: 40px 20px;
            }

            .name {
                font-size: 2rem;
            }

            .tagline {
                font-size: 0.95rem;
                margin-bottom: 25px;
            }

            .glass-button {
                padding: 12px 15px;
                font-size: 0.95rem;
            }

            .button-icon {
                width: 36px;
                height: 36px;
                margin-right: 12px;
            }

            .button-icon img {
                width: 20px;
                height: 20px;
            }

            .links-container {
                gap: 10px;
            }

            .blob-1,
            .blob-2,
            .blob-3 {
                filter: blur(30px);
            }
        }

        @media (max-width: 360px) {
            .glass-card {
                padding: 30px 15px;
                border-radius: 15px;
            }

            .name {
                font-size: 1.75rem;
            }

            .tagline {
                font-size: 0.9rem;
                margin-bottom: 20px;
            }

            .button-text {
                font-size: 0.9rem;
            }
        }

        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        body {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
        }

        /* Selection Styling */
        ::selection {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        /* Webkit Scrollbar Styling (Chrome, Edge, Safari) */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
            margin: 5px 0;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 5px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: background 0.3s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.7);
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:active {
            background: rgba(255, 255, 255, 0.9);
            background-clip: padding-box;
        }
    </style>


</head>

<body>

    <script>
        // Enhanced Ripple Effect on Button Click
        function handleButtonClick(event) {
            const button = event.target;

            // Create multiple ripples for better effect
            for (let i = 0; i < 2; i++) {
                const ripple = document.createElement('span');

                // Get button dimensions
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = event.clientX - rect.left - size / 2;
                const y = event.clientY - rect.top - size / 2;

                // Set ripple styles
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = i === 0
                    ? 'radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent)'
                    : 'radial-gradient(circle, rgba(102, 126, 234, 0.6), transparent)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = `rippleEffect ${0.6 + i * 0.2}s ease-out`;
                ripple.style.pointerEvents = 'none';
                ripple.style.zIndex = i;

                // Add ripple to button
                button.style.position = 'relative';
                button.appendChild(ripple);

                // Remove ripple after animation
                setTimeout(() => ripple.remove(), (0.6 + i * 0.2) * 1000);
            }

            // Add a slight pulse effect to the button
            button.style.animation = 'buttonPulse 0.4s ease-out';
            setTimeout(() => {
                button.style.animation = '';
            }, 400);

            console.log('Button clicked:', button.textContent);
        }

        // Define animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rippleEffect {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
            
            @keyframes buttonPulse {
                0% {
                    transform: scale(1.05);
                }
                50% {
                    transform: scale(1.02);
                }
                100% {
                    transform: scale(1.05);
                }
            }
        `;
        document.head.appendChild(style);

        // Enhanced floating animation for the card
        const card = document.querySelector('.glass-card');
        let floatOffset = 0;

        setInterval(() => {
            floatOffset += 0.05;
            const floatY = Math.sin(floatOffset) * 4;
            const floatX = Math.cos(floatOffset * 0.7) * 2;
            card.style.transform = `translate(${floatX}px, ${floatY}px)`;
        }, 50);

        // Add staggered animation to buttons
        const buttons = document.querySelectorAll('.glass-button');
        buttons.forEach((btn, index) => {
            btn.style.animationDelay = `${index * 0.1}s`;
            btn.style.animation = 'buttonSlideIn 0.6s ease-out backwards';
        });

        // Add button slide in animation
        const slideInStyle = document.createElement('style');
        slideInStyle.textContent = `
            @keyframes buttonSlideIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(slideInStyle);
    </script>
